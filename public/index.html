<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Prolific Teens and Youth Ministry</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    /* NAV */
    nav {
      display: flex;
      gap: 20px;
      padding: 15px;
      background: #0b1a3a;
      color: white;
      align-items: center;
      flex-wrap: wrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    header {
      text-align: center;
      padding: 20px;
    }

    .section {
      background: white;
      margin: 20px;
      padding: 20px;
      border-radius: 10px;
    }

    /* WHEEL */
    .wheel-container {
      position: relative;
      width: 250px;
      margin: 20px auto;
    }

    .wheel {
      width: 100%;
      animation: none;
    }

    .arrow {
      position: absolute;
      top: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
    }

    button {
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<!-- NAVIGATION -->
<nav>
  ☰
  <a href="#">🏠 Home</a>
  <a href="#">📞 Contact Us</a>
  <a href="#">🤝 Givings</a>
  <a href="#">👥 About Us</a>
</nav>

<!-- HEADER -->
<header>
  <h1>✝️ THE PROLIFIC TEENS AND YOUTH MINISTRY ✝️</h1>
  <p>Raising a Generation of Purpose | Excellence | Faith</p>
</header>

<!-- COLOR GAME -->
<div class="section">
  <h2>🎉 Color Game 🎉</h2>

  <label>Name:</label>
  <input type="text" placeholder="Enter name" />

  <label>Zone:</label>
  <input type="text" placeholder="Enter zone" />

  <br><br>

  <button onclick="play()">Spin 🎡</button>

  <div class="wheel-container">
    <img src="wheel.png" id="wheel" class="wheel">
    <img src="arrow.png" class="arrow">
  </div>

  <div id="result"></div>

  <p onclick="showTime()" style="cursor:pointer; color:blue;">
    Click to check current time
  </p>

  <div id="time"></div>
</div>

<!-- ADMIN LOGIN -->
<div class="section">
  <h3>🔐 Admin Login</h3>
  <button>Login</button>
</div>

<!-- ADMIN PANEL -->
<div class="section">
  <h3>🛠️ Admin Panel</h3>
  <button>View Players</button>
  <button>Reset Game</button>
  <button>Add</button>
</div>

<script>
function play() {
  const wheel = document.getElementById("wheel");
  const result = document.getElementById("result");

  let rotation = Math.floor(Math.random() * 3600);
  wheel.style.transform = `rotate(${rotation}deg)`;

  result.innerText = "Spinning...";
}

function showTime() {
  document.getElementById("time").innerText =
    new Date().toLocaleTimeString();
}
</script>

</body>
</html>
