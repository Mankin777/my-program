<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership Portal</title>

<style>
body{
    font-family: Arial, sans-serif;
    background:#0d1b2a;
    color:white;
    padding:30px;
    margin:0;
}

.container{
    max-width:1100px;
    margin:auto;
}

section{
    margin-bottom:40px;
    background:#1b263b;
    padding:20px;
    border-radius:12px;
}

input, button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
    box-sizing:border-box;
}

button{
    background:gold;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    background:darkorange;
}

.table-wrapper{
    overflow-x:auto;
    width:100%;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border:1px solid #415a77;
    padding:12px;
    text-align:center;
    word-wrap:break-word;
    overflow:hidden;
    text-overflow:ellipsis;
    max-width:180px;
}

.pending{color:orange;}
.verified{color:lime;}
.failed{color:red;}

#adminPanel{
    display:none;
}

/* MENU */
.menu-links{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-left:30px;
}

.menu-icon{
    position:fixed;
    top:15px;
    left:15px;
    font-size:30px;
    cursor:pointer;
    z-index:1000;
}

.sidebar{
    position:fixed;
    top:0;
    left:-250px;
    width:250px;
    height:100%;
    background:rgb(0,0,31);
    transition:0.4s;
    padding-top:60px;
}

.menu-links a.active button{
    border:2px solid darkorange;
}
</style>
</head>
<body>

<!-- MENU -->
<div class="menu-icon" onclick="openMenu()">☰</div>
<div class="menu-icon" style="margin-left:40px;" onclick="closeMenu()">↩️</div>

<div id="sidebar" class="sidebar">
<nav class="menu-links">
<a href="index.html"><button>Home 🏠</button></a>
<a href="conform.html"><button>📞 Contact Us</button></a>
<a href="partnership.html"><button>Givings 🤝</button></a>
<a href="aboutUs.html"><button>About Us 👥</button></a>
</nav>
</div>

<div class="container">

<section>
<h1>Prolific Teens & Youth Partnership</h1>

<form id="partnershipForm">
<input type="text" name="name" placeholder="Full Name" required>

<input type="number" name="amount" placeholder="Amount" required>

<label>Partnership Arm:</label>
<input list="arms" name="arms" id="arm" placeholder="Select or type partnership arm" required>

<datalist id="arms">
<option value="Rhapsody">
<option value="Church Contributions">
<option value="Technical Support">
<option value="Inner City Missions">
</datalist>

<input type="file" name="proof">

<button type="submit">Submit Partnership</button>
</form>
</section>

<section>
<h2>Partnership Records</h2>

<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Arm</th>
<th>Status</th>
<th>Date</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>
</div>

<button id="loadMore">Load More</button>
</section>

<section>
<h2>Admin Login</h2>
<input type="password" id="adminPassword" placeholder="Admin Password">
<button onclick="loginAdmin()">Login</button>
</section>

<section id="adminPanel">
<h2>Admin Verification Panel</h2>
<div id="adminRecords"></div>
<button onclick="clearAllRecords()">Clear All Records</button>
</section>

</div>

<script>
    async function deleteRecord(id) {
    await fetch(`/api/partnership/${id}`, {
        method: "DELETE"
    });

    loadAdminPartnerships();
}

async function clearAllRecords() {
    if (!confirm("Delete all records?")) return;

    await fetch("/api/partnerships", {
        method: "DELETE"
    });

    document.getElementById("records").innerHTML = "";
    loadAdminPartnerships();
}
// MENU
function openMenu(){
    document.getElementById("sidebar").style.left="0";
}

function closeMenu(){
    document.getElementById("sidebar").style.left="-250px";
}

let page=1;

// FORM SUBMIT
document.getElementById("partnershipForm").addEventListener("submit", async e=>{
    e.preventDefault();

    const formData=new FormData(e.target);

    const res=await fetch("/api/partnership",{
        method:"POST",
        body:formData
    });

    const data=await res.json();
    alert(data.message);

    e.target.reset();
    page=1;
    document.getElementById("records").innerHTML="";
    loadRecords();
});

// LOAD RECORDS
async function loadRecords(){
    const res=await fetch(`/api/partnerships?page=${page}`);
    const data=await res.json();

    const tbody=document.getElementById("records");

    data.forEach(item=>{
        tbody.innerHTML+=`
        <tr>
            <td>${item.name}</td>
            <td>₦${item.amount}</td>
            <td>${item.arms || "-"}</td>
            <td class="${item.status}">${item.status}</td>
            <td>${new Date(item.createdAt).toLocaleDateString()}</td>
        </tr>`;
    });
}

document.getElementById("loadMore").addEventListener("click",()=>{
    page++;
    loadRecords();
});

// ADMIN LOGIN
async function loginAdmin(){
    const password=document.getElementById("adminPassword").value;

    const res=await fetch("/api/admin/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({password})
    });

    const data=await res.json();

    if(data.success){
        document.getElementById("adminPanel").style.display="block";
        loadAdminPartnerships();
    }else{
        alert("Invalid admin password");
    }
}

// ADMIN RECORDS
async function loadAdminPartnerships(){
    const res=await fetch("/api/partnerships?page=1");
    const data=await res.json();

    let html=`
    <div class="table-wrapper">
    <table>
    <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Arm</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>`;

    data.forEach(item=>{
        html+=`
        <tr>
            <td>${item.name}</td>
            <td>₦${item.amount}</td>
            <td>${item.arms || "-"}</td>
            <td>${item.status}</td>
            <td>
                <button onclick="updateStatus('${item._id}','verified')">Verify</button>
                <button onclick="updateStatus('${item._id}','failed')">Fail</button>
                <button onclick="updateStatus('${item._id}','pending')">Pending</button>
                <button onclick="deleteRecord('${item._id}')">Delete</button>
            </td>
        </tr>`;
    });

    html+="</table></div>";

    document.getElementById("adminRecords").innerHTML=html;
}

// UPDATE STATUS
async function updateStatus(id,status){
    await fetch(`/api/partnership/${id}`,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({status})
    });

    loadAdminPartnerships();

    page=1;
    document.getElementById("records").innerHTML="";
    loadRecords();
}

loadRecords();

// ACTIVE MENU
document.addEventListener("DOMContentLoaded",()=>{
    const links=document.querySelectorAll(".menu-links a");
    const currentPage=window.location.pathname.split("/").pop();

    links.forEach(link=>{
        if(link.getAttribute("href")===currentPage){
            link.classList.add("active");
        }
    });
});

async function deleteRecord(id) {
    await fetch(`/api/partnership/${id}`, {
        method: "DELETE"
    });

    loadAdminPartnerships();
}

async function clearAllRecords() {
    if (!confirm("Delete all records?")) return;

    await fetch("/api/partnerships", {
        method: "DELETE"
    });

    document.getElementById("records").innerHTML = "";
    loadAdminPartnerships();
}
</script>

</body>
</html>
