<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership Portal</title>

<style>
body{
    font-family:Arial;
    background:#0d1b2a;
    color:white;
    padding:30px;
}

.container{
    max-width:1100px;
    margin:auto;
}

section{
    margin-bottom:40px;
    background:#1b263b;
    padding:20px;
    border-radius:12px;
}

input, button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    background:gold;
    cursor:pointer;
    font-weight:bold;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #415a77;
    padding:12px;
    text-align:center;
}

.pending{color:orange;}
.verified{color:lime;}
.failed{color:red;}

#adminPanel{
    display:none;
}
/*menu bar icon */
.menu-links{
    display:flex;
    flex-direction:column;
    gap:5px;
    padding-left:30px;
}
.menu-links button{
    width:130px;
    height:40px;
    margin-left: 50px;
}
.menu-icon{
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 30px;
    cursor: pointer;
    z-index: 1000;
}

.sidebar{
    position: fixed;
    top: 0;
    left: -250px;
    width: 250px;
    height: 100%;
    background: rgb(0, 0, 31);
    transition: 0.4s;
}
button {
    padding: 12px 20px;
    background: rgb(0, 0, 31);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    color: white;
}

button:hover {
    background: darkorange;
}
/*on selecting that particular active button related to <a>*/
.menu-links a.active button {
    border: 2px solid darkorange;
}

</style>
</head>
<body>
      <!--menu bar, dropdown selection-->

<div class="menu-icon" onclick="openMenu()">☰</div> 
<div class="menu-icon" style ="margin-left: 30px;" onclick="closeMenu()">↩️</div>
<div id="sidebar" class="sidebar">
<br>
  <br>
   <br>
  <br>

  <nav class="menu-links" >
    <a href="index.html" ><button style =" color: white; margin-left: 30px;"><b>Home 🏠</b></button></a><br>
     <a href="conform.html" ><button style =" color: white; margin-left: 30px;"><b>📞ontact_us</b></button></a><br>
     <a href="partnership.html" ><button style =" color: white; margin-left: 30px;"><b>Givings 🤝</b></button></a><br>
     <a href="aboutUs.html"  ><button style ="color: white; margin-left: 30px;"><b>About US</b><span style="font-size: large;" >👥</span></button></a><br>
     </nav>
</div>

<div class="container">

<section>
<h1>Prolific Teens & Youth Partnership</h1>

<form id="partnershipForm">
<input type="text" name="name" placeholder="Full Name" required>
<input type="number" name="amount" placeholder="Amount" required>
<input type="file" name="proof">
<button type="submit">Submit Partnership</button>
</form>
</section>

<section>
<h2>Partnership Records</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>

<button id="loadMore">Load More</button>
</section>

<section>
<h2>Admin Login</h2>

<input type="password" id="adminPassword" placeholder="Admin Password">
<button onclick="loginAdmin()">Login</button>
</section>

<section id="adminPanel">
<h2>Admin Verification Panel</h2>
<div id="adminRecords"></div>
</section>

</div>

<script>
    //open menu function
function openMenu(){
  document.getElementById("sidebar").style.left = "0";
}
function closeMenu(){
  document.getElementById("sidebar").style.left = "-250px";
}

let page=1;
let adminLoggedIn=false;

document.getElementById("partnershipForm").addEventListener("submit", async e=>{
    e.preventDefault();

    const formData=new FormData(e.target);

    const res=await fetch("/api/partnership",{
        method:"POST",
        body:formData
    });

    const data=await res.json();
    alert(data.message);

    e.target.reset();
});

async function loadRecords(){
    const res=await fetch(`/api/partnerships?page=${page}`);
    const data=await res.json();

    const tbody=document.getElementById("records");

    data.forEach(item=>{
        tbody.innerHTML+=`
        <tr>
        <td>${item.name}</td>
        <td>₦${item.amount}</td>
        <td class="${item.status}">${item.status}</td>
        <td>${new Date(item.createdAt).toLocaleDateString()}</td>
        </tr>`;
    });
}

document.getElementById("loadMore").addEventListener("click",()=>{
    page++;
    loadRecords();
});

async function loginAdmin(){

    const password=document.getElementById("adminPassword").value;

    const res=await fetch("/api/admin/login",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({password})
    });

    const data=await res.json();

    if(data.success){
        adminLoggedIn=true;
        document.getElementById("adminPanel").style.display="block";
        loadAdminPartnerships();
    }else{
        alert("Invalid admin password");
    }
}

async function loadAdminPartnerships(){

    const res=await fetch("/api/partnerships?page=1");
    const data=await res.json();

    let html="<table><tr><th>Name</th><th>Amount</th><th>Status</th><th>Actions</th></tr>";

    data.forEach(item=>{
        html+=`
        <tr>
        <td>${item.name}</td>
        <td>₦${item.amount}</td>
        <td>${item.status}</td>
        <td>
        <button onclick="updateStatus('${item._id}','verified')">Verify</button>
        <button onclick="updateStatus('${item._id}','failed')">Fail</button>
        <button onclick="updateStatus('${item._id}','pending')">Pending</button>
        </td>
        </tr>`;
    });

    html+="</table>";

    document.getElementById("adminRecords").innerHTML=html;
}

async function updateStatus(id,status){

    await fetch(`/api/partnership/${id}`,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({status})
    });

    loadAdminPartnerships();
}

loadRecords();

// javascript url for the border line selection when on  particular page for each button
document.addEventListener("DOMContentLoaded", () => {
    const links = document.querySelectorAll(".menu-links a");
    const currentPage = window.location.pathname.split("/").pop();

    links.forEach(link => {
        if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
        }
    });
});

</script>

</body>
</html>
