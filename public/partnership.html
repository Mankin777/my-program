<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partnership Portal</title>

<style>
body{
    font-family: Arial;
    background:#0d1b2a;
    color:white;
    padding:30px;
}

.container{
    max-width:1000px;
    margin:auto;
}

form{
    background:#1b263b;
    padding:20px;
    border-radius:12px;
}

input, button{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:none;
    border-radius:8px;
}

button{
    background:gold;
    font-weight:bold;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:30px;
    background:#1b263b;
}

th, td{
    padding:15px;
    border:1px solid #415a77;
    text-align:center;
}

.pending{color:orange;}
.verified{color:lime;}
.failed{color:red;}

#loadMore{
    margin-top:20px;
}
</style>
</head>
<body>

<div class="container">

<h1>Prolific Teens & Youth Partnership</h1>

<form id="partnershipForm">
    <input type="text" name="name" placeholder="Full Name" required>
    <input type="number" name="amount" placeholder="Amount" required>
    <input type="file" name="proof">
    <button type="submit">Submit</button>
</form>

<h2>Partnership Records</h2>

<table>
<thead>
<tr>
<th>Name</th>
<th>Amount</th>
<th>Status</th>
<th>Date</th>
</tr>
</thead>
<tbody id="records"></tbody>
</table>

<button id="loadMore">Load More</button>

<h2>Partnership Verification</h2>
<div id="adminRecords"></div>

</div>

<script>
let page = 1;

document.getElementById("partnershipForm").addEventListener("submit", async e=>{
    e.preventDefault();

    const formData = new FormData(e.target);

    const res = await fetch("/api/partnership",{
        method:"POST",
        body:formData
    });

    const data = await res.json();
    alert(data.message);

    e.target.reset();
    page=1;
    document.getElementById("records").innerHTML="";
    loadRecords();
});

async function loadRecords(){
    const res = await fetch(`/api/partnerships?page=${page}`);
    const data = await res.json();

    const tbody = document.getElementById("records");

    data.forEach(item=>{
        tbody.innerHTML += `
        <tr>
            <td>${item.name}</td>
            <td>₦${item.amount}</td>
            <td class="${item.status}">${item.status}</td>
            <td>${new Date(item.createdAt).toLocaleDateString()}</td>
        </tr>
        `;
    });
}

document.getElementById("loadMore").addEventListener("click",()=>{
    page++;
    loadRecords();
});

loadRecords();

const partnershipSchema = new mongoose.Schema({
    name:String,
    amount:Number,
    proof:String,
    status:{
        type:String,
        default:"pending"
    },
    createdAt:{
        type:Date,
        default:Date.now
    }
});

const Partnership = mongoose.model("Partnership", partnershipSchema);

const storage = multer.diskStorage({
    destination:(req,file,cb)=>{
        cb(null,"uploads/");
    },
    filename:(req,file,cb)=>{
        cb(null,Date.now()+"-"+file.originalname);
    }
});

const upload = multer({storage});

app.post("/api/partnership", upload.single("proof"), async(req,res)=>{
    try{
        const record = new Partnership({
            name:req.body.name,
            amount:req.body.amount,
            proof:req.file ? req.file.path : null
        });

        await record.save();

        res.json({
            success:true,
            message:"Submission received. Awaiting verification."
        });

    }catch(err){
        res.json({
            success:false,
            message:"Submission failed."
        });
    }
});

app.get("/api/partnerships", async(req,res)=>{

    const page = parseInt(req.query.page) || 1;
    const limit = 10;
    const skip = (page - 1) * limit;

    const records = await Partnership.find()
        .sort({createdAt:-1})
        .skip(skip)
        .limit(limit);

    res.json(records);
});


app.put("/api/partnership/:id", async(req,res)=>{

    await Partnership.findByIdAndUpdate(req.params.id,{
        status:req.body.status
    });

    res.json({success:true});
});

async function loadAdminPartnerships(){

    const res = await fetch("/api/partnerships?page=1");
    const data = await res.json();

    let html = "<table border='1' width='100%'>";
    html += `
    <tr>
        <th>Name</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Actions</th>
    </tr>
    `;

    data.forEach(item=>{
        html += `
        <tr>
            <td>${item.name}</td>
            <td>₦${item.amount}</td>
            <td>${item.status}</td>
            <td>
                <button onclick="updateStatus('${item._id}','verified')">Verify</button>
                <button onclick="updateStatus('${item._id}','failed')">Fail</button>
                <button onclick="updateStatus('${item._id}','pending')">Pending</button>
            </td>
        </tr>
        `;
    });

    html += "</table>";

    document.getElementById("adminRecords").innerHTML = html;
}

async function updateStatus(id,status){

    await fetch(`/api/partnership/${id}`,{
        method:"PUT",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({status})
    });

    loadAdminPartnerships();
}

loadAdminPartnerships();
</script>

</body>
</html>
